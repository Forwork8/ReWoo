<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Executive Dashboard — Order Desk</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/jpeg" href="../assets/logo.jpg"/>
  <link rel="stylesheet" href="app.css"/>
</head>
<body x-data="dashApp()" x-init="init()">
<div class="page-bg" aria-hidden="true"></div>
<a href="#main-content" class="skip-link">Skip to content</a>

<!-- ══ TOP NAV ══ -->
<nav class="top-nav">
  <a href="../index.html" class="top-nav__logo">
    <img src="../assets/logo.jpg" alt="ReWoo"/>
    <span>ReWoo</span>
    <span class="product-tag">Order Desk Pro</span>
  </a>
  <div class="top-nav__spacer"></div>
  <div class="workspace-badge" x-text="currentOrg?.organisations?.name || 'My Factory'"></div>
  <div class="top-nav__user">
    <div class="user-avatar" x-text="initials"></div>
    <button class="btn btn-ghost btn-sm" @click="signOut">Sign out</button>
  </div>
</nav>

<!-- ══ LAYOUT ══ -->
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="app-sidebar">
    <span class="sidebar-title">Dashboard</span>
    <a class="sidebar-link active" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Orders Overview
      <span class="sidebar-count" x-text="orders.length"></span>
    </a>
    <a class="sidebar-link" href="order.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Quotation
    </a>
    <a class="sidebar-link" href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>

    <span class="sidebar-title" style="margin-top:1.5rem;">Pipeline Status</span>
    <button class="sidebar-link" :class="{active: statusFilter==='all'}" @click="statusFilter='all'; applyFilters()" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
      All Orders <span class="sidebar-count" x-text="orders.length"></span>
    </button>
    <template x-for="s in ['draft','quoted','confirmed','shipped']" :key="s">
      <button class="sidebar-link" :class="{active: statusFilter===s}" @click="statusFilter=s; applyFilters()" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
        <span x-text="s.charAt(0).toUpperCase()+s.slice(1)"></span>
        <span class="sidebar-count" x-text="orders.filter(o=>o.status===s).length"></span>
      </button>
    </template>
  </aside>

  <!-- ══ MAIN DASHBOARD ══ -->
  <main class="app-main" id="main-content">
    <div x-show="loading" style="text-align:center;padding:4rem;">
      <p style="color:var(--text-muted);">Syncing Executive Portfolio...</p>
    </div>

    <template x-if="!loading">
      <div>
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
          <div>
            <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.03em;">Orders Portfolio</h1>
            <p style="color:var(--text-sub);font-size:0.85rem;" x-text="`${currentOrg?.organisations?.name || 'Workspace'} · ${filteredOrders.length} orders tracked`"></p>
          </div>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-ghost" @click="exportExcel()">Export Portfolio</button>
            <a href="order.html" class="btn btn-primary">+ New Quotation</a>
          </div>
        </div>

        <!-- 4 Keynote Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__icon">📋</div>
            <div class="stat-card__label">Active Orders</div>
            <div class="stat-card__value" x-text="orders.length"></div>
            <div class="stat-card__sub" x-text="`${orders.filter(o=>o.status==='confirmed').length} In Production`"></div>
          </div>

          <div class="stat-card">
            <div class="stat-card__icon">💰</div>
            <div class="stat-card__label">Gross Order Book</div>
            <div class="stat-card__value" x-text="fmtK(totalFOB)"></div>
            <div class="stat-card__sub">Total FOB Valuation</div>
          </div>

          <div class="stat-card">
            <div class="stat-card__icon">📈</div>
            <div class="stat-card__label">Est. Factory Margin</div>
            <div class="stat-card__value" style="color:var(--status-green);" x-text="fmtK(totalProfit)"></div>
            <div class="stat-card__sub" x-text="`${avgMargin.toFixed(1)}% Average Yield`"></div>
          </div>

          <div class="stat-card">
            <div class="stat-card__icon">🚢</div>
            <div class="stat-card__label">Shipped Volume</div>
            <div class="stat-card__value" x-text="shippedCount"></div>
            <div class="stat-card__sub">Completed Deliveries</div>
          </div>
        </div>

        <!-- Search and Filters -->
        <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem;">
          <input class="form-input" style="max-width:320px;" type="text" x-model="searchQuery" @input="applyFilters()" placeholder="Search by buyer, style code, PO#..."/>
          <select class="form-select" style="max-width:180px;" x-model="sortBy" @change="applyFilters()">
            <option value="newest">Newest First</option>
            <option value="fob_desc">Highest Valuation</option>
            <option value="qty_desc">Highest Volume</option>
          </select>
        </div>

        <!-- Orders Table -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order #</th>
                <th>Buyer</th>
                <th>Style Ref</th>
                <th>Quantity</th>
                <th>FOB Price</th>
                <th>Total Value</th>
                <th>Margin</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="o in filteredOrders" :key="o.id">
                <tr @click="goOrder(o.id)">
                  <td style="font-family:var(--f-mono);font-weight:600;" x-text="o.order_number || 'PO-DRAFT'"></td>
                  <td style="font-weight:600;" x-text="o.buyer || '—'"></td>
                  <td style="font-family:var(--f-mono);color:var(--text-sub);" x-text="o.style_ref || '—'"></td>
                  <td x-text="`${(o.quantity||0).toLocaleString()} pcs`"></td>
                  <td style="font-family:var(--f-mono);font-weight:600;" x-text="`$${Number(o.fob_price||0).toFixed(2)}`"></td>
                  <td style="font-family:var(--f-mono);font-weight:700;" x-text="fmtK((o.fob_price||0)*(o.quantity||0))"></td>
                  <td>
                    <span style="font-family:var(--f-mono);color:var(--status-green);font-weight:600;" x-text="`${o.target_margin || 20}%`"></span>
                  </td>
                  <td>
                    <span class="badge" :class="`badge-${o.status||'draft'}`" x-text="o.status||'draft'"></span>
                  </td>
                  <td>
                    <button class="btn btn-ghost btn-sm" @click.stop="deleteOrder(o.id)" style="color:var(--status-red);border-color:transparent;">Delete</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

      </div>
    </template>
  </main>
</div>

<div id="toast-container"></div>

<!-- ══ SCRIPTS ══ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="supabase.js"></script>

<script>
function showToast(msg) {
  const el = document.createElement('div');
  el.className = `toast`;
  el.innerHTML = `<span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

const fmtK = v => {
  if (!v) return '$0';
  const n = Number(v);
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
};

function dashApp() {
  return {
    loading: true,
    user: null,
    initials: 'U',
    currentOrg: null,
    orders: [],
    filteredOrders: [],
    statusFilter: 'all',
    searchQuery: '',
    sortBy: 'newest',

    get totalFOB() {
      return this.orders.reduce((sum, o) => sum + ((Number(o.fob_price)||0) * (Number(o.quantity)||0)), 0);
    },
    get totalProfit() {
      return this.orders.reduce((sum, o) => {
        const val = (Number(o.fob_price)||0) * (Number(o.quantity)||0);
        const m = (Number(o.target_margin)||20) / 100;
        return sum + val * (m / (1 + m));
      }, 0);
    },
    get avgMargin() {
      if (!this.orders.length) return 20;
      return this.orders.reduce((s,o) => s + (Number(o.target_margin)||20), 0) / this.orders.length;
    },
    get shippedCount() {
      return this.orders.filter(o => o.status === 'shipped').length;
    },

    async init() {
      const session = await OD.requireAuth();
      if (!session) return;
      this.user = session.user;
      const name = session.user.user_metadata?.full_name || session.user.email || 'U';
      this.initials = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) || 'U';

      const memberships = await OD.OrgsAPI.listMemberships(session.user.id);
      const savedId = localStorage.getItem('od-current-org');
      this.currentOrg = memberships.find(m => m.organisation_id === savedId) || memberships[0] || null;

      await this.loadOrders();
      this.loading = false;
    },

    async loadOrders() {
      if (!this.currentOrg) return;
      this.orders = await OD.OrdersAPI.list(this.currentOrg.organisation_id);
      this.applyFilters();
    },

    applyFilters() {
      let list = [...this.orders];
      if (this.statusFilter !== 'all') list = list.filter(o => o.status === this.statusFilter);
      if (this.searchQuery) {
        const q = this.searchQuery.toLowerCase();
        list = list.filter(o => (o.buyer||'').toLowerCase().includes(q) || (o.style_ref||'').toLowerCase().includes(q) || (o.order_number||'').toLowerCase().includes(q));
      }
      if (this.sortBy === 'newest') list.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      if (this.sortBy === 'fob_desc') list.sort((a,b) => ((b.fob_price||0)*(b.quantity||0)) - ((a.fob_price||0)*(a.quantity||0)));
      if (this.sortBy === 'qty_desc') list.sort((a,b) => (b.quantity||0) - (a.quantity||0));
      this.filteredOrders = list;
    },

    goOrder(id) {
      window.location.href = `order.html?id=${id}`;
    },

    async deleteOrder(id) {
      if (!confirm('Permanently remove this order?')) return;
      await OD.OrdersAPI.delete(id);
      this.orders = this.orders.filter(o => o.id !== id);
      this.applyFilters();
      showToast('Order removed');
    },

    exportExcel() {
      const rows = [
        ['ORDER DESK — EXECUTIVE ORDERS PORTFOLIO'],
        ['Order #', 'Buyer', 'Style', 'Quantity', 'FOB Price', 'Total Valuation', 'Status'],
        ...this.orders.map(o => [
          o.order_number, o.buyer, o.style_ref, o.quantity, o.fob_price, (o.fob_price||0)*(o.quantity||0), o.status
        ])
      ];
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, 'Portfolio');
      XLSX.writeFile(wb, `Orders_Portfolio_${Date.now()}.xlsx`);
      showToast('Portfolio exported to Excel');
    },

    async signOut() {
      await OD.Auth.signOut();
      window.location.href = 'auth.html';
    }
  };
}
</script>
</body>
</html>
